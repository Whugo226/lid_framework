# =============================================================================
# environment.yml — lid_toolkit conda environment (Stellenbosch HPC)
#
# Create:  conda env create -f environment.yml
# Update:  conda env update -f environment.yml --prune
# Activate: conda activate thesis_final
#
# After creating the environment, download the spaCy language models with:
#   python scripts/download_spacy_models.py
# =============================================================================

name: thesis_final

channels:
  - conda-forge
  - defaults

dependencies:
  # ── Core scientific stack ────────────────────────────────────────────────
  - python=3.11
  - pip
  - numpy>=1.26
  - pandas>=2.1
  - scipy>=1.12
  - scikit-learn>=1.4
  - tqdm>=4.66

  # ── NLP / language tooling ────────────────────────────────────────────────
  - spacy>=3.7            # language pipeline; models installed separately via pip

  # ── Utilities ────────────────────────────────────────────────────────────
  - pyyaml>=6.0           # config file parsing
  - openpyxl>=3.1         # Excel I/O in tests

  # ── Pip-only packages ────────────────────────────────────────────────────
  - pip:
    # FastText language identification model loader
    - fasttext-wheel>=0.9.2

    # Compressed FastText word vectors (for cosine similarity in DeepProfiler)
    - compress-fasttext>=0.1.4

    # Word frequency scoring (Zipf)
    - wordfreq>=3.1.1

    # Fast Levenshtein distance
    - editdistance>=0.8.1

    # HuggingFace model hub (downloads compressed FastText models at runtime)
    - huggingface-hub>=0.23

    # CLI framework used by lid_toolkit entry point
    - typer>=0.12

    # spaCy language models — 24 languages supported by DeepProfiler
    # Install order: larger models first to surface any disk-space issues early.
    - https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
    - https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl
    - https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl
    - https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl
    - https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl
    - https://github.com/explosion/spacy-models/releases/download/it_core_news_sm-3.8.0/it_core_news_sm-3.8.0-py3-none-any.whl
