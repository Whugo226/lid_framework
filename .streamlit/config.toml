# ─────────────────────────────────────────────────────────────────────────────
# Visual identity for the LID Framework explainer.
#
# Design brief: adopt the visual language of Gentelella v4 (Colorlib, MIT), a
# conventional admin-dashboard system, so the artefact reads as a professional
# operations console rather than a one-off research script. The tokens below are
# transcribed from Gentelella's own src/scss/v4/_tokens.scss (dark theme) so the
# two systems agree exactly rather than approximately:
#
#   * Two surface levels over a recessed body. The body is #0F1623; cards and
#     the sidebar sit ON it at #1A2332; inset tiles drop to #141D2B. Depth comes
#     from this three-step stack plus a hairline border, never from a gradient.
#   * The brand accent is Gentelella's teal #1ABB9C (hover #169F85), used for
#     interactive affordances: primary buttons, the active tab rule, links and
#     focus rings.
#   * The full 11-hue Gentelella palette drives chart series and badges, as on
#     the template's own demo pages. Note the trade-off this accepts: colour is
#     now decorative as well as semantic, so a yellow bar in a chart no longer
#     implies a coverage warning the way it did under the previous theme. The
#     coverage guard therefore states its meaning in text, never in hue alone.
#   * Geometry follows Gentelella: 8px card radius, 6px base, 4px controls, and
#     a 4px spacing scale. Body text is 14px / 1.43.
#
# Typeface: IBM Plex Sans is retained rather than Gentelella's Inter. Inter is
# served from Google Fonts upstream, whereas these files are self-hosted so the
# app renders identically with no network (the oral defence may be offline), and
# IBM Plex has the tabular figures the metric tiles depend on. The two are both
# neutral grotesques at text sizes, so the system reads as intended.
#
# Font files live in src/lid_toolkit/explainer/static/fonts/ — Streamlit resolves
# the static directory relative to the SCRIPT, not the working directory, so they
# sit beside dashboard.py. Latin subset only. IBM Plex Sans ships as a variable
# file, so it is declared once per weight actually used.
#
# This file is discovered relative to the WORKING directory, so the app must be
# launched from the repo root for the theme to apply (which is already required
# for the profiler's ./fasttext_cache).
# ─────────────────────────────────────────────────────────────────────────────

[server]
enableStaticServing = true

# ── Typeface ─────────────────────────────────────────────────────────────────
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans.woff2"
style = "normal"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans.woff2"
style = "normal"
weight = 500

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans.woff2"
style = "normal"
weight = 600

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-400.woff2"
style = "normal"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-500.woff2"
style = "normal"
weight = 500

# ── Theme ────────────────────────────────────────────────────────────────────
[theme]
base = "dark"

font        = "IBM Plex Sans"
headingFont = "IBM Plex Sans"
codeFont    = "IBM Plex Mono"
# Gentelella sets --font-size: 0.875rem (14px) with --line-height 1.4286. An
# admin console runs denser type than a document; the panels carry more figures
# per screen as a result.
baseFontSize   = 14
baseFontWeight = 400
# Gentelella's headings are small and tightly ranked — the card title is 13px.
# Hierarchy is carried by weight and the rule beneath a title, not by size jumps.
headingFontSizes   = ["1.35rem", "1.05rem", "0.95rem", "0.88rem", "0.85rem", "0.82rem"]
headingFontWeights = [600, 600, 600, 600, 500, 500]

primaryColor             = "#1ABB9C"   # Gentelella --primary
backgroundColor          = "#0F1623"   # --body-bg (dark)
secondaryBackgroundColor = "#1A2332"   # --bg-surface (dark)
textColor                = "#E6EBF2"   # --text
linkColor                = "#2FD4B2"
codeBackgroundColor      = "#141D2B"   # --bg-surface-secondary
codeTextColor            = "#B3BCCB"   # --text-secondary

# --border-color in the dark theme is rgba(255,255,255,0.08); Streamlit needs an
# opaque value, so these are that alpha resolved over the surface beneath.
borderColor                    = "#242E3D"
dataframeBorderColor           = "#242E3D"
dataframeHeaderBackgroundColor = "#141D2B"
showWidgetBorder  = true
showSidebarBorder = true
baseRadius   = "medium"
buttonRadius = "small"

# Note: Streamlit 1.58 has no per-hue palette keys (red/green/...), so the
# semantic colours used by st.warning / st.error / st.info come from its dark
# base theme. The Gentelella hues the app draws itself live in dashboard.py so
# charts, tables and alerts stay in one family.

# The full Gentelella palette, ordered for legibility on the dark surface.
chartCategoricalColors = [
  "#4299E1",  # azure
  "#1ABB9C",  # primary teal
  "#F59F00",  # yellow
  "#AE3EC9",  # purple
  "#2FB344",  # green
  "#F76707",  # orange
  "#4263EB",  # indigo
  "#D6336C",  # pink
  "#17A2B8",  # cyan
  "#74B816",  # lime
  "#D63939",  # red
]
# A teal ramp from the body surface up to the brand accent, for heatmaps.
chartSequentialColors = [
  "#111A28", "#122830", "#133538", "#144340", "#155048",
  "#165E50", "#176B58", "#188060", "#199E7E", "#1ABB9C",
]

[theme.sidebar]
backgroundColor          = "#1A2332"   # --sidebar-bg
secondaryBackgroundColor = "#141D2B"
borderColor              = "#242E3D"
