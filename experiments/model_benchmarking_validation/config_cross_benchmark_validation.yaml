# =============================================================================
# config_cross_benchmark_validation.yaml — Confirmatory Validation Cross-Benchmark
#
# Drives hpc_cross_benchmark.py (reused from model_benchmarking_evaluation/)
# to evaluate every trained LID model against every 03_validation_15_cleaned
# dataset — the reserved, untouched validation splits — producing the
# ground-truth matrix for the SINGLE confirmatory run of the framework
# (validate_recommendations_validation.py) under the frozen evaluation
# protocol (k=3, f1_weighted, same recommender invocation as the recorded
# evaluation run).
#
# librispeech_asr exists in 03_validation_15_cleaned but is OUTSIDE the
# 17-dataset portfolio and is deliberately not listed below.
#
# Override at HPC runtime via environment variables:
#   LID_TRAINING_RESULTS_DIR  → paths.training_results_dir
#   LID_EVAL_DATA_DIR         → paths.eval_data_dir
#   LID_BENCHMARK_EVAL_DIR    → paths.benchmark_eval_dir
# =============================================================================

paths:
  training_results_dir: "model_training_results"
  eval_data_dir:        "datasets/03_validation_15_cleaned"
  benchmark_eval_dir:   "model_benchmarking_validation"

# ── Model families (identical to the evaluation-side config) ─────────────────
families:
  fasttext:
    results_subdir: "fasttext_results"
    model_file:     "model.bin"
    variants:
      - "fasttext_word"
      - "fasttext_subword"

  logistic_regression:
    results_subdir: "logistic_regression_results"
    model_file:     "best_pipeline.pkl"
    variants:
      - "bow_maxabs_lr_char_ngram_3_5"
      - "tfidf_lr_char_ngram_3_5"

  naive_bayes:
    results_subdir: "naive_bayes_results"
    model_file:     "best_pipeline.pkl"
    variants:
      - "bow_char_ngram_3_5"
      - "tfidf_char_ngram_3_5"

# ── Validation datasets (17-dataset portfolio; librispeech_asr excluded) ─────
eval_datasets:
  - "amazon_reviews_multi"
  - "europarl"
  - "exorde-social-media-december-2024-week1"
  - "flores_plus"
  - "language-identification"
  - "massive"
  - "mmarco"
  - "multi_eurlex"
  - "multilingual_cc_news"
  - "multilingual_toxicity_dataset"
  - "OpenLID-v2"
  - "stsb_multi_mt"
  - "tweet_sentiment_multilingual"
  - "tydiqa"
  - "wikipedia"
  - "xlsum"
  - "xnli"

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  log_filename: "cross_benchmark_validation.log"
  level:        "INFO"
