[project]
name = "lid_toolkit"
version = "0.1.0"
description = "An interactive framework for recommending language identification models for short-text corpora"
readme = "README.md"
authors = [
  {name = "Werner Hugo", email = "wernerhugo2002@gmail.com"}
]
maintainers = [
  {name = "Werner Hugo", email = "wernerhugo2002@gmail.com"}
]
classifiers = [
    # TODO
]
license = {text = "MIT"}
dependencies = [
  "typer"
]
requires-python = ">= 3.10"

[project.optional-dependencies]
test = [
    "coverage",  # testing
    "pytest",  # testing
    "ruff",  # linting
    "ty", # checking types
    "ipdb", # debugging
    "openpyxl",  # Excel file I/O
]

[project.urls]
bugs = "https://github.com/Whugo226/lid_framework/issues"
changelog = "https://github.com/Whugo226/lid_framework/blob/main/HISTORY.md"
homepage = "https://github.com/Whugo226/lid_framework"

[project.scripts]
lid_toolkit = "lid_toolkit.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.uv]
package = true
