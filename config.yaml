# =============================================================================
# config.yaml — Meta-Knowledge Base Build Configuration
# =============================================================================
# Paths are resolved as follows (in priority order):
#   1. Environment variable override (set in submit_job.sh for HPC)
#   2. Value in this file — if relative, resolved from this file's directory
#   3. Built-in default (see hpc_build_mkb.py)
#
# Override table (set these in submit_job.sh or your shell before running):
#   LID_DATASETS_ROOT  → paths.datasets_root
#   LID_PROFILES_DIR   → paths.profiles_dir
#   LID_BENCHMARK_DIR  → paths.benchmark_dir
#   LID_MKB_OUTPUT     → paths.mkb_output_path
# =============================================================================

# ── Paths ─────────────────────────────────────────────────────────────────────
paths:
  # Root directory containing one sub-folder per dataset.
  # Each sub-folder holds *.parquet files named {iso}_{id}.parquet.
  datasets_root: "~/LID_Experiments/datasets/01b_knowledge_benchmark_20_cleaned"

  # Where profile .pkl files (one per dataset) are written by Phase 1.
  # Persisted back to TOOLKIT_ROOT/profiles/ after the job completes.
  profiles_dir: "profiles"

  # Root of model_benchmarking results (sub-dirs per model family).
  # Needed for Phase 2 (MKB assembly). Set to null to skip assembly.
  benchmark_dir: "~/LID_Experiments/model_benchmarking"

  # Final serialised MKBStore (used by Recommender.from_store()).
  mkb_output_path: "mkb.pkl"

# ── Phase 1: Dataset Profiling ────────────────────────────────────────────────
profiling:
  # Datasets to skip even if they exist in datasets_root.
  # Useful for isolating a single dataset during debugging.
  # Set to [] (empty list) to process all datasets found.
  skip_datasets: []

# ── Phase 2: MKB Assembly ─────────────────────────────────────────────────────
mkb:
  # Fraction of total variance retained by PCA per stratum.
  variance_threshold: 0.95

  # Hard cap on PCA components per stratum (prevents over-fitting on small
  # datasets with many features).
  max_pca_components: 20

  # Default number of nearest neighbours returned by Recommender.recommend().
  k: 3

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  # Written alongside the script (or to profiles_dir if that is on scratch).
  log_filename: "build_mkb.log"
  level: "INFO"
